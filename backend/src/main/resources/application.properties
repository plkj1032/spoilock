spring.application.name=backend

# 최상위 .env 불러오기
spring.config.import=file:../.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spoilock}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=spoilock
app.jwt.access-minutes=15

# Refresh Token 유효기간
app.jwt.refresh-days=7

# Cookie: 로컬 HTTP 개발환경
app.auth.cookie-secure=${COOKIE_SECURE:false}

# Kakao OAuth2 Client
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-name=Kakao

# Kakao OAuth2 Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
# =========================================================
# 스포일러 판별 AI 서버 (Python FastAPI) 연동
# =========================================================
app.spoiler.base-url=${SPOILER_API_BASE_URL:http://127.0.0.1:8000}
app.spoiler.connect-timeout-ms=2000
app.spoiler.read-timeout-ms=15000

# FastAPI /judge 요청 옵션
app.spoiler.kb-version=kb1
app.spoiler.top-k=20
app.spoiler.include-evidence=true
app.spoiler.reason-mode=short
# 비우면 Python 서버의 PREFILTER_MODE 사용 (off / shadow / on)
app.spoiler.prefilter-mode=${SPOILER_PREFILTER_MODE:on}

# 판정 → 공개 정책 (fail-closed: 확실한 것만 공개)
# 미검증(데모) 사건 회차를 공개 기준으로 사용할지. 로컬 데모에서만 true
app.spoiler.allow-unverified-demo=${SPOILER_ALLOW_UNVERIFIED_DEMO:false}
app.spoiler.publish-skipped-general=true
app.spoiler.publish-skipped-unrelated=false
app.spoiler.publish-no-match=${SPOILER_PUBLISH_NO_MATCH:false}
# NO_MATCH 중 Gemini가 '드라마 이야기 아님'으로 판단한 일상 대화는 공개
app.spoiler.publish-off-topic=${SPOILER_PUBLISH_OFF_TOPIC:true}

# =========================================================
# 관리자 자막 분석·사건 관리 (Python /admin/*, /kb/episodes)
# =========================================================
# Python .env 의 ADMIN_TOKEN 과 같은 값 (비우면 헤더 생략)
app.spoiler.admin.token=${SPOILER_ADMIN_TOKEN:}
app.spoiler.admin.read-timeout-ms=30000
# 현재 영어 자막만 운영
app.spoiler.admin.language=en
# 진행 중인 자막 분석 작업 상태 조회 주기
app.spoiler.admin.poll-interval-ms=5000
# 작품별 판정 회차 목록 캐시 (초)
app.spoiler.admin.kb-cache-seconds=60

# 작품별 판정 범위는 Python /kb/episodes 로 자동 조회 (Python drama_id = Spring dramas.id)
# 아래 demo / dramas 설정은 Python 조회 실패 시 대체용, dramas[n] 은 수동 지정이 필요할 때만 사용
# Spring 작품 ID → Python 사건 DB 연결
# 현재 데모 사건 데이터: Python drama_id=1, 1~6화
app.spoiler.demo.spring-drama-id=${SPOILER_DEMO_DRAMA_ID:1}
app.spoiler.demo.kb-drama-id=1
app.spoiler.demo.episodes=1,2,3,4,5,6
# 작품이 늘어나면 아래 형식으로 추가 (키의 숫자 = Spring dramas.id)
# app.spoiler.dramas[2].kb-drama-id=2
# app.spoiler.dramas[2].episodes=1,2,3,4,5,6,7,8

# 유실·중단된 분석 복구
app.spoiler.recovery.enabled=true
app.spoiler.recovery.interval-ms=30000
app.spoiler.recovery.pending-after-seconds=20
app.spoiler.recovery.processing-after-seconds=180
app.spoiler.recovery.retry-failed-within-minutes=10
app.spoiler.recovery.batch-size=20

# 비공개 자막 저장 디렉터리
app.subtitle-storage-dir=${SUBTITLE_STORAGE_DIR:./private/subtitles}

# 자막 및 MP4 공통 업로드 최대 크기
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# MP4 비공개 저장 디렉터리
app.video-storage-dir=${VIDEO_STORAGE_DIR:./private/videos}
app.feed-image-storage-dir=${FEED_IMAGE_STORAGE_DIR:./private/feed-images}