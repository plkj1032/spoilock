spring.application.name=backend

# 최상위 .env 불러오기
spring.config.import=file:../.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spoilock}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=spoilock
app.jwt.access-minutes=15

# Refresh Token 유효기간
app.jwt.refresh-days=7

# Cookie: 로컬 HTTP 개발환경
app.auth.cookie-secure=${COOKIE_SECURE:false}