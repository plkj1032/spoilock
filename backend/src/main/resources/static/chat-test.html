<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SpoiLock 채팅 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
</head>
<body>

<h2>SpoiLock 채팅 테스트</h2>

<p>같은 브라우저에서 로그인한 후 사용해 주세요.</p>

<div>
    <label>
        방 번호:
        <input id="roomId" type="number" min="1" value="1">
    </label>
    <button id="connectButton">서버 연결</button>
    <button id="disconnectButton" disabled>연결 종료</button>
</div>

<p id="connectionStatus">연결 안 됨</p>

<div>
    <button id="enterButton" disabled>방 입장</button>
    <button id="leaveButton" disabled>방 퇴장</button>
</div>

<form id="messageForm">
    <p>
        <input id="content" maxlength="2000" placeholder="메시지 입력">
        <button id="sendButton" type="submit" disabled>전송</button>
    </p>
</form>

<button id="clearButton">화면 기록 지우기</button>
<pre id="messages"></pre>

<script>
    let client = null;
    let connectedRoomId = null;

    const roomInput = document.getElementById("roomId");
    const contentInput = document.getElementById("content");
    const connectionStatus = document.getElementById("connectionStatus");
    const messages = document.getElementById("messages");

    const connectButton = document.getElementById("connectButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const enterButton = document.getElementById("enterButton");
    const leaveButton = document.getElementById("leaveButton");
    const sendButton = document.getElementById("sendButton");

    function log(text) {
        messages.textContent += text + "\n";
    }

    function setConnected(connected) {
        connectButton.disabled = connected;
        disconnectButton.disabled = !connected;
        enterButton.disabled = !connected;
        leaveButton.disabled = !connected;
        sendButton.disabled = !connected;
        roomInput.disabled = connected;
    }

    function connect() {
        const roomId = Number(roomInput.value);

        if (!Number.isSafeInteger(roomId) || roomId <= 0) {
            alert("올바른 방 번호를 입력해 주세요.");
            return;
        }

        connectedRoomId = roomId;
        connectButton.disabled = true;
        roomInput.disabled = true;
        connectionStatus.textContent = "연결 중...";

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";

        client = new StompJs.Client({
            brokerURL: `${protocol}//${location.host}/ws`,
            reconnectDelay: 0,
            connectionTimeout: 5000,

            onConnect: () => {
                client.subscribe(
                    "/user/queue/chat",
                    async (frame) => {
                        const event = JSON.parse(frame.body);

                        if (event.roomId !== connectedRoomId) {
                            return;
                        }

                        try {
                            const response = await fetch(
                                `/api/chat/rooms/${event.roomId}/messages/${event.messageId}`,
                                {
                                    credentials: "same-origin"
                                }
                            );

                            if (response.status === 403) {
                                log("메시지 조회 권한이 없습니다.");
                                return;
                            }

                            if (response.status === 401) {
                                log("로그인이 만료되었습니다. 다시 로그인해 주세요.");
                                return;
                            }

                            if (!response.ok) {
                                log(`메시지 조회 실패: ${response.status}`);
                                return;
                            }

                            const message = await response.json();

                            if (message.visibility === "BLOCK") {
                                log(
                                    `[메시지 ${message.messageId}] 🔒 공개되지 않은 메시지입니다.`
                                );
                                return;
                            }

                            if (message.messageType === "CHAT") {
                                log(
                                    `[메시지 ${message.messageId}] ` +
                                    `${message.nickname}: ${message.content}`
                                );
                            } else {
                                log(`[${message.messageType}] ${message.content}`);
                            }
                        } catch (error) {
                            log("메시지를 불러오지 못했습니다.");
                            console.error(error);
                        }
                    }
                );

                setConnected(true);
                connectionStatus.textContent =
                    `서버 연결됨 · 방 ${connectedRoomId} 알림 구독 중`;

                log("서버 연결 완료. 방 참여 등록은 '방 입장' 버튼을 사용하세요.");
            },

            onStompError: (frame) => {
                log("STOMP 오류: " + (frame.headers.message ?? frame.body));
            },

            onWebSocketError: () => {
                log("연결 오류: 로그인 상태와 서버 실행 여부를 확인하세요.");
            },

            onWebSocketClose: () => {
                setConnected(false);
                connectionStatus.textContent = "연결 종료";
            }
        });

        client.activate();
    }

    async function disconnect() {
        if (client) {
            await client.deactivate();
            client = null;
        }

        setConnected(false);
        connectionStatus.textContent = "연결 종료";
        log("서버 연결을 종료했습니다. 방 참여 상태는 유지됩니다.");
    }

    function publish(destination, body) {
        if (!client?.connected) {
            alert("먼저 서버에 연결해 주세요.");
            return false;
        }

        client.publish({
            destination: destination,
            headers: {
                "content-type": "application/json"
            },
            body: JSON.stringify(body)
        });

        return true;
    }

    connectButton.addEventListener("click", connect);
    disconnectButton.addEventListener("click", disconnect);

    enterButton.addEventListener("click", () => {
        if (publish("/app/chat.enter", {
            roomId: connectedRoomId
        })) {
            log("입장 요청 전송. 이미 참여 중이면 새 알림이 없습니다.");
        }
    });

    leaveButton.addEventListener("click", () => {
        if (publish("/app/chat.leave", {
            roomId: connectedRoomId
        })) {
            log("퇴장 요청 전송. 이미 퇴장한 상태면 새 알림이 없습니다.");
        }
    });

    document.getElementById("messageForm")
        .addEventListener("submit", (event) => {
            event.preventDefault();

            const content = contentInput.value.trim();

            if (!content) {
                alert("메시지를 입력해 주세요.");
                return;
            }

            if (publish("/app/chat.send", {
                roomId: connectedRoomId,
                content: content
            })) {
                contentInput.value = "";
            }
        });

    document.getElementById("clearButton")
        .addEventListener("click", () => {
            messages.textContent = "";
        });
</script>

</body>
</html>
